name: feed-refresh

# MoneyBall consumes the Book and Registry as read-only source planes.
# Refreshes are deterministic projections; the source records remain in the monorepo.
# Publication uses the specialist App and a reviewed PR, never a direct main push.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [book-feed-changed, cards-feed-changed]

permissions:
  contents: read

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Mint the MoneyBall App installation token
        id: app-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_MONEYBALL_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_MONEYBALL_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout with the specialist App identity
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up the generator runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch authoritative source feeds
        env:
          BOOK_FEED_URL: https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo/master/ops/agentic-gambling/book/book-feed.json
          REGISTRY_URL: https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo/master/docs/ops/AGENT-MONIKERS.md
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$BOOK_FEED_URL" --output "$RUNNER_TEMP/book-feed.json"
          curl --fail --silent --show-error --location "$REGISTRY_URL" --output "$RUNNER_TEMP/AGENT-MONIKERS.md"
          python3 -m json.tool "$RUNNER_TEMP/book-feed.json" >/dev/null

      - name: Refresh the Book mirror verbatim
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/book-feed.json" data/book-feed.json

      - name: Rebuild cards from the Registry and Book feeds
        run: |
          set -euo pipefail
          python3 scripts/generate_cards_feed.py \
            --monikers "$RUNNER_TEMP/AGENT-MONIKERS.md" \
            --book-feed data/book-feed.json \
            --out "$RUNNER_TEMP/cards-feed.generated.json"
          python3 - "$RUNNER_TEMP/cards-feed.generated.json" data/cards-feed.json <<'PY'
          import json, shutil, sys

          volatile = {"generated_at", "generator_run_id", "snapshot_at"}

          def stable(value):
              if isinstance(value, dict):
                  return {k: stable(v) for k, v in value.items() if k not in volatile}
              if isinstance(value, list):
                  return [stable(v) for v in value]
              return value

          candidate_path, current_path = sys.argv[1:]
          with open(candidate_path, encoding="utf-8") as f:
              candidate = json.load(f)
          try:
              with open(current_path, encoding="utf-8") as f:
                  current = json.load(f)
          except FileNotFoundError:
              current = None

          if current is not None and stable(candidate) == stable(current):
              print("Cards feed unchanged at the source-data level; preserving the existing snapshot.")
          else:
              shutil.copyfile(candidate_path, current_path)
              print("Cards feed source data changed; staging the regenerated snapshot.")
          PY

      - name: Validate every published feed
        run: |
          set -euo pipefail
          python3 scripts/validate_feeds.py

      - name: Open or update the reviewed feed-refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/feed-refresh
          delete-branch: true
          add-paths: |
            data/book-feed.json
            data/cards-feed.json
          commit-message: "data: refresh Book and cards publication feeds"
          title: "data: refresh Book and cards feeds"
          body: |
            Automated, receipt-preserving projection refresh.

            - Mirrors the monorepo Book publication feed verbatim.
            - Rebuilds the cards feed from the Registry and mirrored Book feed.
            - Runs the repository feed validator before publication.
            - Uses the specialist `termux-fleet-moneyball[bot]` App identity.

            Source records remain authoritative in `timerloggedout-spec/termux-monorepo`.
            Nulls and `NOT_ESTABLISHED` states remain explicit; hidden internal metrics stay excluded.
          base: main
