name: Validate feeds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and regenerate the wallet projection
        env:
          WALLET_LEDGER_URL: https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo/master/ops/agentic-gambling/site/wallet-ledger.jsonl
          WALLET_LEDGER_TOOL_URL: https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo/master/scripts/moneyball/wallet_ledger.py
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$WALLET_LEDGER_URL" --output "$RUNNER_TEMP/wallet-ledger.jsonl"
          curl --fail --silent --show-error --location "$WALLET_LEDGER_TOOL_URL" --output "$RUNNER_TEMP/wallet_ledger.py"
          python3 "$RUNNER_TEMP/wallet_ledger.py" verify "$RUNNER_TEMP/wallet-ledger.jsonl"
          ledger_blob="$(git hash-object "$RUNNER_TEMP/wallet-ledger.jsonl")"
          python3 scripts/generate_wallets_feed.py \
            --ledger "$RUNNER_TEMP/wallet-ledger.jsonl" \
            --out "$RUNNER_TEMP/wallets-feed.generated.json" \
            --ledger-blob "$ledger_blob"
          python3 - "$RUNNER_TEMP/wallets-feed.generated.json" data/wallets-feed.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              generated = json.load(f)
          with open(sys.argv[2], encoding="utf-8") as f:
              published = json.load(f)
          for key in ("wallets", "reconciliation", "claims_ceiling", "unit_transition"):
              if generated[key] != published[key]:
                  raise SystemExit(f"wallets feed drift: {key} differs from the verified ledger projection")
          if generated["generated_from"]["ledger_blob"] != published["generated_from"]["ledger_blob"]:
              raise SystemExit("wallets feed drift: source ledger blob differs")
          print(f"wallets projection matches {len(generated['wallets'])} ledger-derived rows")
          PY
      - run: python3 scripts/validate_feeds.py
